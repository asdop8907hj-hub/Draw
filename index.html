let lang="en";
let curRound=null;
let result=null;

const RS=660;

/*
 * 如果 index.html 和 Worker 在同一个域名：
 *
 * API_BASE = ""
 *
 * 如果 Worker 是单独的 workers.dev：
 *
 * API_BASE = "https://你的-worker.workers.dev"
 */
const API_BASE="";

function $(id){
  return document.getElementById(id);
}

function setLang(l){
  lang=l;

  const t=L[l];

  document.documentElement.lang=
    l==="zh" ? "zh-CN" : l;

  $("t-title").textContent=t.title;
  $("t-sub").textContent=t.sub;

  $("t-round").textContent=t.round;
  $("t-live").textContent=t.live;
  $("t-next").textContent=t.next;
  $("t-result").textContent=t.result;

  $("t-rounddata").textContent=t.rounddata;
  $("t-rid").textContent=t.rid;
  $("t-rtime").textContent=t.rtime;
  $("t-source").textContent=t.source;

  $("t-chains").textContent=t.chains;
  $("t-calc").textContent=t.calc;

  $("t-orig").textContent=t.orig;
  $("t-formula").textContent=t.formula;

  $("t-verifylbl").textContent=t.verifylbl;
  $("t-verifydesc").textContent=t.verifydesc;
  $("t-verifybtn").textContent=t.verifybtn;
  $("t-foot").textContent=t.foot;

  document
    .querySelectorAll("#langBar button")
    .forEach(b=>{
      b.classList.toggle(
        "on",
        b.dataset.lang===l
      );
    });

  const st=$("resSt");

  if(
    st.classList.contains("wait")
  ){
    st.textContent=t.wait;
  }
}

document
  .querySelectorAll("#langBar button")
  .forEach(b=>{
    b.onclick=()=>{
      setLang(b.dataset.lang);
    };
  });

function getRound(){
  return Math.floor(
    Date.now()/(RS*1000)
  );
}

function roundStart(r){
  return r*RS*1000;
}

function fmtUTC(ts){
  return new Date(ts)
    .toISOString()
    .replace("T"," ")
    .replace(".000Z"," UTC");
}

function tick(){
  const now=Date.now();

  const r=getRound();

  const start=roundStart(r);

  const next=
    start+
    RS*1000;

  const rem=Math.max(
    0,
    next-now
  );

  const pct=
    rem/
    (RS*1000)*
    100;

  $("progBar").style.width=
    pct+"%";

  const s=
    Math.ceil(rem/1000);

  $("countdown").textContent=
    String(
      Math.floor(s/60)
    ).padStart(2,"0")
    +
    ":"
    +
    String(
      s%60
    ).padStart(2,"0");

  $("roundNum").textContent=r;

  $("rid").textContent=r;

  $("rtime").textContent=
    fmtUTC(start);

  /*
   * 只有真正进入下一轮时才重新请求 Worker。
   */
  if(curRound!==r){
    curRound=r;

    result=null;

    resetUI();

    fetchRound(r);
  }
}

function resetUI(){
  const t=L[lang];

  $("resNum").textContent="----";

  $("resNum")
    .classList
    .add("loading");

  $("resSt").className=
    "res-st wait";

  $("resSt").textContent=
    t.wait;

  [
    "btcHash",
    "tronHash",
    "tonHash",
    "srcHash",
    "origData",
    "shaVal"
  ].forEach(id=>{
    $(id).textContent="----";
  });

  [
    "btcSt",
    "tronSt",
    "tonSt"
  ].forEach(id=>{
    $(id).textContent=t.wait;
  });
}

async function fetchRound(round){
  const t=L[lang];

  try{
    const url=
      API_BASE+
      "/api/result?round="+
      encodeURIComponent(round);

    const response=
      await fetch(
        url,
        {
          method:"GET",
          cache:"no-store",
          headers:{
            "Accept":
              "application/json"
          }
        }
      );

    if(!response.ok){
      throw new Error(
        "Worker HTTP "+response.status
      );
    }

    const payload=
      await response.json();

    if(
      !payload.ok ||
      !payload.data
    ){
      throw new Error(
        payload.error ||
        "Invalid Worker response"
      );
    }

    const d=payload.data;

    /*
     * 防止旧 Round 的请求晚返回，
     * 覆盖当前 Round 的页面。
     */
    if(
      Number(d.round)!==
      Number(getRound())
    ){
      return;
    }

    result={
      round:d.round,
      btc:d.btc,
      tron:d.tron,
      ton:d.ton,
      orig:d.orig,
      sha:d.sha,
      res:d.result
    };

    $("roundNum").textContent=
      d.round;

    $("rid").textContent=
      d.round;

    $("rtime").textContent=
      fmtUTC(d.roundStart);

    $("btcHash").textContent=
      d.btc;

    $("tronHash").textContent=
      d.tron;

    $("tonHash").textContent=
      d.ton;

    $("btcSt").textContent=
      t.fetched;

    $("tronSt").textContent=
      t.fetched;

    $("tonSt").textContent=
      t.fetched;

    $("origData").textContent=
      d.orig;

    $("shaVal").textContent=
      d.sha;

    $("srcHash").textContent=
      d.sha;

    $("resNum").textContent=
      d.result;

    $("resNum")
      .classList
      .remove("loading");

    $("resSt").className=
      "res-st ok";

    $("resSt").textContent=
      t.ready;

  }catch(e){

    console.error(e);

    $("resNum").textContent=
      "----";

    $("resNum")
      .classList
      .remove("loading");

    $("resSt").className=
      "res-st err";

    $("resSt").textContent=
      t.error;
  }
}

async function sha256hex(s){
  const b=
    new TextEncoder()
      .encode(s);

  const h=
    await crypto.subtle.digest(
      "SHA-256",
      b
    );

  return Array
    .from(
      new Uint8Array(h)
    )
    .map(
      x=>
        x.toString(16)
         .padStart(2,"0")
    )
    .join("");
}

async function fair4(seed){
  const M=2n**256n;
  const T=10000n;
  const rem=M%T;

  let hex=
    await sha256hex(seed);

  let big=
    BigInt("0x"+hex);

  while(
    big>=M-rem
  ){
    hex=
      await sha256hex(hex);

    big=
      BigInt("0x"+hex);
  }

  return String(
    big%T
  ).padStart(4,"0");
}

function cp(el){
  const v=
    el.textContent.trim();

  if(
    !v ||
    v==="----"
  ){
    return;
  }

  navigator
    .clipboard
    .writeText(v)
    .then(()=>{
      const toast=$("toast");

      toast.textContent=
        L[lang].copied;

      toast.classList.add(
        "show"
      );

      setTimeout(()=>{
        toast.classList.remove(
          "show"
        );
      },1200);
    })
    .catch(()=>{});
}

async function doVerify(){

  const t=L[lang];

  if(!result){
    alert(t.noResult);
    return;
  }

  try{

    /*
     * 前端只验证 Worker 已经保存的
     * 原始数据。
     *
     * 不重新请求 BTC/TRON/TON。
     */

    const sha=
      await sha256hex(
        result.orig
      );

    const res=
      await fair4(
        result.orig
      );

    if(
      sha===result.sha &&
      res===result.res
    ){

      alert(
        t.verifyOk+
        "\n"+
        res
      );

    }else{

      alert(
        t.verifyFail
      );
    }

  }catch(e){

    console.error(e);

    alert(
      t.verifyFail
    );
  }
}

setLang("en");

/*
 * 先初始化一次页面，
 * tick() 会负责第一次请求。
 */
tick();

setInterval(
  tick,
  1000
);
</script>
